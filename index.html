<style>
:root{--ac:#06c8ff;--tx:#eaf6ff;--mu:#8fb4cf;--gl:rgba(255,255,255,.08);--bd:rgba(255,255,255,.16);--red:#ff6b6b;--ok:#3ddc97}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:linear-gradient(160deg,#051a30,#0a3558 60%,#07263f) fixed;min-height:100vh;padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom))}
h1{font:italic 900 21px/1.1 system-ui;margin:0}h2{font:italic 900 22px system-ui;margin:0 0 10px}h3{font:italic 800 17px system-ui;margin:0 0 4px}p{margin:6px 0}
.hd{display:flex;align-items:center;gap:12px;padding:14px 16px 6px;max-width:960px;margin:auto}.lg{border-radius:16px;overflow:hidden;height:54px;width:54px;flex:none}.lg img{height:100%;width:100%;object-fit:contain}
main{max-width:960px;margin:auto;padding:8px 14px}
.card{background:var(--gl);border:1px solid var(--bd);border-radius:22px;padding:14px;margin:0 0 12px;backdrop-filter:blur(10px)}
.g3{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-top:8px}.qb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 0}
.btn{border:0;border-radius:99px;background:var(--ac);color:#04243d;font:800 15px system-ui;padding:12px 18px;min-height:44px;cursor:pointer}.btn.g{background:var(--gl);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:var(--red);color:#2b0803}.btn.s{min-height:36px;padding:6px 12px;font-size:13px}.wide{width:100%;margin-bottom:12px}
input,select,textarea{width:100%;font:16px system-ui;color:var(--tx);background:rgba(0,0,0,.3);border:1px solid var(--bd);border-radius:14px;padding:11px;min-height:44px;margin-top:4px}option{color:#000}
label{display:block;font-size:13px;color:var(--mu);margin:0 0 10px}.ck{display:flex;align-items:center;gap:8px;margin:0 0 6px;color:var(--tx);font-size:15px}.ck input{width:auto;min-height:0;margin:0}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}.rw:last-child{border:0}.mu{color:var(--mu);font-size:13px}
.pb{height:10px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:8px}.pb i{display:block;height:100%;background:var(--ac)}
.pos{color:var(--ok)}.neg{color:var(--red)}.nw{font:italic 900 32px system-ui;color:var(--ac)}
.ch{display:inline-block;padding:4px 10px;border-radius:99px;font:800 12px system-ui;color:#10240a;white-space:nowrap;margin:2px 4px 2px 0}.ch.ok{background:var(--ok)}.ch.no{background:var(--red);color:#2b0803}.ch.gr{background:var(--gl);color:var(--tx);border:1px solid var(--bd)}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:2px;background:rgba(5,26,48,.94);backdrop-filter:blur(12px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
#nav button{flex:1;max-width:120px;background:0;border:0;color:var(--mu);font:700 11px system-ui;padding:6px 2px;border-radius:12px;cursor:pointer}#nav button span{display:block;font-size:20px}#nav button.on{color:#04243d;background:var(--ac)}
dialog{width:min(520px,94vw);max-height:90vh;overflow:auto;background:#0a2c4a;color:var(--tx);border:1px solid var(--bd);border-radius:22px;padding:16px}dialog::backdrop{background:rgba(0,0,0,.6)}
.by{position:fixed;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;pointer-events:none;font:800 12px system-ui;color:#04243d;background:var(--ac);padding:5px 11px;border-radius:99px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
#sp{position:fixed;inset:0;z-index:30;background:radial-gradient(circle at 50% 42%,#f4f4f4,#e3e3e3 78%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;transition:opacity .6s;touch-action:manipulation;overflow:hidden}
#sp.out{opacity:0;pointer-events:none}
#sp .vw{position:relative;width:min(100%,860px);aspect-ratio:16/9;-webkit-mask-image:radial-gradient(ellipse closest-side,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse closest-side,#000 58%,transparent 100%)}
#sp video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
#sp form{width:min(280px,82vw);text-align:center;margin-top:-2vw;animation:pin .5s ease both}
@keyframes pin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#sp input{margin:0;text-align:center;letter-spacing:.3em;font-weight:700;color:#0b4a78;background:#fff;border:2.5px solid #1a8fd6;border-radius:16px;box-shadow:0 2px 12px rgba(26,143,214,.18);outline:0}
#sp input::placeholder{letter-spacing:normal;font-weight:400;color:#7b9bb3}
#sp input:focus{box-shadow:0 0 0 4px rgba(26,143,214,.25)}
#sp .btn{background:#1a8fd6;color:#fff;margin:10px 0 0}
#sp #lke{color:#d33;min-height:1.4em;margin:6px 0 0;font-weight:700;font-size:14px}
#sp .hint{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font:600 12px system-ui;color:#6b7f8f;transition:opacity .3s}
#pr{display:none}

// ===== PIN & mulai =====
const SP=$('#sp'),SV=$('#spv'),LF=$('#lkf'),LI=$('#lki'),LE=$('#lke'),SH=$('#sph'),RM=matchMedia('(prefers-reduced-motion: reduce)'),STILL_AT=5.6;
let ph='',pv=0,tm=0;
const setAnim=(k,v)=>{D.anim[k]=v?1:0;save()};
function closeSp(){if(ph=='gone')return;ph='gone';clearTimeout(tm);SP.classList.add('out');setTimeout(()=>{SP.hidden=true;SV.pause()},600)}
function showEnd(skip){if(ph!='play'&&ph!='still')return;ph='end';clearTimeout(tm);SH.style.opacity=0;
 if(pv){tm=setTimeout(closeSp,skip?0:700);return}
 if(D.pin){LF.hidden=false;LI.focus()}else tm=setTimeout(closeSp,skip?0:700)}
function intro(preview){pv=!!preview;ph='';clearTimeout(tm);SP.hidden=false;SP.classList.remove('out');LF.hidden=true;LE.textContent='';LI.value='';SH.style.opacity=1;SV.pause();SV.currentTime=0;
 const still=RM.matches||!D.anim.on;
 if(still){ph='still';SH.style.opacity=0;SV.load();tm=setTimeout(()=>showEnd(),preview?1200:500);return}
 if(!SV.src)SV.src=SV.dataset.src;
 SV.muted=!D.anim.snd;ph='play';
 const go=()=>SV.play().catch(()=>{if(!SV.muted){SV.muted=true;SV.play().catch(()=>showEnd(1))}else showEnd(1)});SV.currentTime=0;go()}
SV.onended=()=>showEnd();SV.onerror=()=>showEnd(1);
SP.onclick=e=>{if(e.target.closest('form'))return;if(ph=='play'){try{SV.currentTime=Math.min(STILL_AT,SV.duration||STILL_AT)}catch(_){}SV.pause();showEnd(1)}else if(ph=='still')showEnd(1)};
LF.onsubmit=e=>{e.preventDefault();if(hs(LI.value)==D.pin){LI.blur();closeSp()}else{LE.textContent='PIN salah';LI.value='';LI.focus()}};
R();intro(0);
if('serviceWorker'in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('service-worker.js');
