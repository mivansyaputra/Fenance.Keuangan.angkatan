<style>
:root{--ac:#06c8ff;--tx:#eaf6ff;--mu:#8fb4cf;--gl:rgba(255,255,255,.08);--bd:rgba(255,255,255,.16);--red:#ff6b6b;--ok:#3ddc97}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:linear-gradient(160deg,#051a30,#0a3558 60%,#07263f) fixed;min-height:100vh;padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom))}
h1{font:italic 900 21px/1.1 system-ui;margin:0}h2{font:italic 900 22px system-ui;margin:0 0 10px}h3{font:italic 800 17px system-ui;margin:0 0 4px}p{margin:6px 0}
.hd{display:flex;align-items:center;gap:12px;padding:14px 16px 6px;max-width:960px;margin:auto}.lg{background:#fff;border-radius:16px;padding:4px;height:54px;width:54px;flex:none}.lg img{height:100%;width:100%;object-fit:contain}
main{max-width:960px;margin:auto;padding:8px 14px}
.card{background:var(--gl);border:1px solid var(--bd);border-radius:22px;padding:14px;margin:0 0 12px;backdrop-filter:blur(10px)}
.g3{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-top:8px}.qb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 0}
.btn{border:0;border-radius:99px;background:var(--ac);color:#04243d;font:800 15px system-ui;padding:12px 18px;min-height:44px;cursor:pointer}.btn.g{background:var(--gl);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:var(--red);color:#2b0803}.btn.s{min-height:36px;padding:6px 12px;font-size:13px}.wide{width:100%;margin-bottom:12px}
input,select,textarea{width:100%;font:16px system-ui;color:var(--tx);background:rgba(0,0,0,.3);border:1px solid var(--bd);border-radius:14px;padding:11px;min-height:44px;margin-top:4px}option{color:#000}
label{display:block;font-size:13px;color:var(--mu);margin:0 0 10px}.ck{display:flex;align-items:center;gap:8px;margin:0 0 6px;color:var(--tx);font-size:15px}.ck input{width:auto;min-height:0;margin:0}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}.rw:last-child{border:0}.mu{color:var(--mu);font-size:13px}
.pb{height:10px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:8px}.pb i{display:block;height:100%;background:var(--ac)}
.pos{color:var(--ok)}.neg{color:var(--red)}.nw{font:italic 900 32px system-ui;color:var(--ac)}
.ch{display:inline-block;padding:4px 10px;border-radius:99px;font:800 12px system-ui;color:#10240a;white-space:nowrap;margin:2px 4px 2px 0}.ch.ok{background:var(--ok)}.ch.no{background:var(--red);color:#2b0803}.ch.gr{background:var(--gl);color:var(--tx);border:1px solid var(--bd)}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:2px;background:rgba(5,26,48,.94);backdrop-filter:blur(12px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
#nav button{flex:1;max-width:120px;background:0;border:0;color:var(--mu);font:700 11px system-ui;padding:6px 2px;border-radius:12px;cursor:pointer}#nav button span{display:block;font-size:20px}#nav button.on{color:#04243d;background:var(--ac)}
dialog{width:min(520px,94vw);max-height:90vh;overflow:auto;background:#0a2c4a;color:var(--tx);border:1px solid var(--bd);border-radius:22px;padding:16px}dialog::backdrop{background:rgba(0,0,0,.6)}
#lk{position:fixed;inset:0;z-index:20;background:#051a30;display:flex;align-items:center;justify-content:center;padding:20px}#lk form{width:min(320px,100%);text-align:center}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}body{background:#fff;padding:0}#pr{display:block;color:#000;font:12px system-ui}#pr table{border-collapse:collapse;width:100%}#pr td,#pr th{border:1px solid #888;padding:3px 5px;text-align:left}}

<script>
const $=s=>document.querySelector(s),K='fenance_immn',dg=$('#dg');
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
D=Object.assign({nama:'Angkatan IMMANNA',pin:0,step:1e6,siswa:[],tag:[],byr:[],kas:[],box:[],lb:0},D||{});
const mig=()=>{if(!D.box||!D.box.length)D.box=[{id:'k1',n:'Kas',h:1}];D.tag.forEach(t=>t.b=t.b||D.box[0].id);D.kas.forEach(k=>k.b=k.b||D.box[0].id);D.siswa.forEach(x=>{x.k=x.k||'';x.a=x.a||''})};mig();
const save=()=>localStorage.setItem(K,JSON.stringify(D)),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),
rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID'),today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),
dm=d=>(d||'').split('-').reverse().join('/'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),
hs=s=>{let x=5381;for(const c of s)x=(x*33)^c.charCodeAt(0);return x>>>0},jt=n=>n>=1e6?+(n/1e6).toFixed(2)+' jt':+(n/1e3).toFixed(1)+' rb',
emp=m=>`<div class="card mu">${m}</div>`,pb=x=>`<div class="pb"><i style="width:${Math.min(100,Math.round(x*100))}%"></i></div>`,
dlg=h=>{dg.innerHTML=h;if(!dg.open)dg.showModal()},cf=$('#cf'),
ask=(m,ok,lbl)=>{cf.innerHTML=`<p>${esc(m)}</p><div class="qb"><button class="btn r" id="cy">${lbl||'Ya'}</button><button class="btn g" onclick="cf.close()">Batal</button></div>`;cf.showModal();$('#cy').onclick=()=>{cf.close();ok()}},
info=m=>{cf.innerHTML=`<p>${esc(m)}</p><button class="btn wide" onclick="cf.close()">OK</button>`;cf.showModal()},
dl=(n,c,t)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click()};
// ===== logika =====
const COL=['#ffd84a','#ffb347','#ff8c42','#ff6b9d','#c58bff','#7be0ff'],cc=p=>COL[Math.min(Math.floor(p/D.step),5)],lb=b=>b==0?'< '+jt(D.step):'≥ '+jt(b*D.step);
const ps=t=>t.w?D.siswa:D.siswa.filter(s=>(t.p||[]).includes(s.id)),pd=(s,t)=>D.byr.filter(b=>b.s==s&&b.t==t).reduce((a,b)=>a+b.j,0);
const sisaS=s=>D.tag.reduce((a,t)=>a+(ps(t).includes(s)?Math.max(t.nom-pd(s.id,t.id),0):0),0);
const bt=b=>D.tag.filter(t=>t.b==b).map(t=>t.id),bm=b=>D.byr.filter(x=>bt(b).includes(x.t)).reduce((a,x)=>a+x.j,0),ki=(b,i)=>D.kas.filter(k=>k.b==b&&k.i==i).reduce((a,k)=>a+k.j,0),
saldo=b=>b?bm(b)+ki(b,'in')-ki(b,'out'):D.box.reduce((a,x)=>a+saldo(x.id),0),
num=v=>+String(v||'').replace(/\D/g,'')||0,fr=n=>n?'Rp '+Math.round(n).toLocaleString('id-ID'):'',kn=t=>esc((D.box.find(b=>b.id==t.b)||{}).n||''),
backup=()=>{D.lb=Date.now();save();dl('fenance-immn-'+today()+'.json',JSON.stringify(D),'application/json');R()};
document.addEventListener('input',e=>{const x=e.target;if(x.classList&&x.classList.contains('rpi')){const d=x.value.replace(/\D/g,'');x.value=d?'Rp '+(+d).toLocaleString('id-ID'):''}});
function sm(t){const a=ps(t),r={l:0,c:0,b:0,bk:{},tot:a.length*t.nom,got:0};a.forEach(s=>{const p=pd(s.id,t.id);r.got+=p;if(p>=t.nom)r.l++;else if(p>0){r.c++;const k=Math.floor(p/D.step);r.bk[k]=(r.bk[k]||0)+1}else r.b++});return r}
const bd=(p,t)=>p>=t.nom?'<span class="ch ok">Lunas</span>':p>0?`<span class="ch" style="background:${cc(p)}">Cicil ${lb(Math.floor(p/D.step))}</span>`:'<span class="ch no">Belum</span>';
const chips=r=>`<span class="ch ok">Lunas ${r.l}</span><span class="ch gr">Cicil ${r.c}</span>`+Object.keys(r.bk).sort((a,b)=>a-b).map(k=>`<span class="ch" style="background:${COL[Math.min(k,5)]}">${lb(+k)}: ${r.bk[k]}</span>`).join('')+`<span class="ch no">Belum ${r.b}</span>`;
const late=(t,r)=>t.dl&&t.dl<today()&&(r.b+r.c)>0?' · <b class="neg">⚠ lewat batas</b>':'';
// ===== tampilan =====
let V='home',ST={t:null,bx:'',q:'',f:'all',k:'',sq:'',sk:''};
const TABS=[['home','🏠','Beranda'],['tag','🧾','Tagihan'],['byr','💸','Bayar'],['sis','👥','Siswa'],['kas','🏦','Kas'],['lain','⚙️','Lainnya']];
const go=v=>{V=v;R();scrollTo(0,0)};
function R(){$('#sub').textContent=D.nama;$('#nav').innerHTML=TABS.map(t=>`<button class="${V==t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('');$('#m').innerHTML=VW[V]()}
const VW={
home(){const T=D.tag.map(t=>[t,sm(t)]),tot=T.reduce((a,x)=>a+x[1].tot,0),got=T.reduce((a,x)=>a+x[1].got,0),top=D.siswa.map(s=>[s,sisaS(s)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5),old=D.siswa.length&&(!D.lb||Date.now()-D.lb>6048e5);
 return (old?`<div class="card" style="border-color:var(--ac)"><b>💾 Data belum dicadangkan${D.lb?' lebih dari 7 hari':''}</b><div class="mu">Data hanya tersimpan di perangkat ini.</div><button class="btn s" style="margin-top:8px" onclick="backup()">Cadangkan sekarang</button></div>`:'')
 +`<div class="g3" style="margin:0 0 12px">`+D.box.filter(b=>b.h).map(b=>`<div class="card" style="margin:0;cursor:pointer" onclick="go('kas')"><div class="mu">Saldo ${esc(b.n)}</div><div class="nw" style="font-size:24px">${rp(saldo(b.id))}</div></div>`).join('')+`<div class="card" style="margin:0;cursor:pointer" onclick="go('kas')"><div class="mu">＋ Atur kotak di Beranda</div><div class="mu">tambah / kurangi lewat tab Kas</div></div></div>`
 +`<div class="card"><div class="g3" style="margin:0"><div><div class="mu">Total tagihan</div><b>${rp(tot)}</b></div><div><div class="mu">Terkumpul</div><b class="pos">${rp(got)}</b></div><div><div class="mu">Belum masuk</div><b class="neg">${rp(Math.max(tot-got,0))}</b></div></div>${pb(tot?got/tot:0)}<div class="mu" style="margin-top:6px">${D.siswa.length} siswa · ${D.tag.length} tagihan</div></div>`
 +(T.length?T.map(([t,r])=>`<div class="card" style="cursor:pointer" onclick="ST.bx='${t.b}';ST.t='${t.id}';ST.q='';ST.f='all';go('byr')"><h3>${esc(t.n)}</h3><div class="mu">${kn(t)} · ${t.w?'Wajib':'Tidak wajib'} · ${rp(t.nom)}/siswa${late(t,r)}</div><div style="margin-top:6px">${rp(r.got)} / ${rp(r.tot)}</div>${pb(r.tot?r.got/r.tot:0)}<div style="margin-top:8px">${chips(r)}</div></div>`).join(''):emp('Mulai: tambah siswa (tab Siswa → impor CSV), lalu buat tagihan (tab Tagihan).'))
 +(top.length?`<div class="card"><h3>Tunggakan terbesar</h3>${top.map(([s,x])=>`<div class="rw" onclick="sisDet('${s.id}')"><span>${esc(s.n)} <span class="mu">${esc(s.k)}</span></span><b class="neg">${rp(x)}</b></div>`).join('')}</div>`:'')},
tag(){return `<button class="btn wide" onclick="tagForm()">＋ Tagihan baru</button>`+(D.tag.length?D.tag.map(t=>{const r=sm(t);return `<div class="card"><h3>${esc(t.n)}</h3><div class="mu">${kn(t)} · ${t.w?'Wajib (semua siswa)':'Tidak wajib · '+ps(t).length+' peserta'} · ${rp(t.nom)}/siswa${t.dl?' · batas '+dm(t.dl):''}${late(t,r)}</div>${pb(r.tot?r.got/r.tot:0)}<div style="margin:8px 0">${chips(r)}</div><button class="btn s" onclick="ST.bx='${t.b}';ST.t='${t.id}';ST.q='';ST.f='all';go('byr')">Buka</button> <button class="btn s g" onclick="tagForm('${t.id}')">Edit</button> <button class="btn s r" onclick="delTag('${t.id}')">Hapus</button></div>`}).join(''):emp('Belum ada tagihan. Contoh: Kas Desember (Wajib, Rp 20.000), Study Tour (Tidak wajib, Rp 1.500.000).'))},

function pcsv(t){t=t.replace(/^\ufeff/,'');const d=t.includes('\t')?'\t':t.includes(';')?';':t.includes(',')?',':'\u0001',o=[];let r=[],c='',q=0;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=h}else if(h=='"')q=1;else if(h==d){r.push(c);c=''}else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';o.push(r);r=[]}else c+=h}r.push(c);o.push(r);return o.map(x=>x.map(v=>v.trim())).filter(x=>x.some(Boolean))}
